services:
  # ── Flask API Web Service (Runs Flask API + Sync Engine Scheduler Inline) ───
  - type: web
    name: classflow-api
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # Connection string to your Neon database
      - key: GEMINI_API_KEY
        sync: false # Your Google AI Studio Gemini API Key
      - key: MY_API_KEY
        sync: false # Custom ClassFlow API auth key (e.g. Classflow123)
      - key: FLASK_DEBUG
        value: "false"
      - key: PORT
        value: "5001"
      - key: POLL_INTERVAL_SECONDS
        value: "3600"
    healthCheckPath: /health

